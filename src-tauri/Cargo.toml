[package]
name = "meetesh"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nareshipme/Meetesh"

[lib]
name = "meetesh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
log = "0.4"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
meetesh-core = { path = "../crates/meetesh-core", features = ["whisper", "llm"] }

# GPU acceleration for the on-device language model: Metal on macOS. Declared here only so Cargo
# turns the feature on for the copy of llama-cpp-2 that meetesh-core already depends on.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["metal"] }
