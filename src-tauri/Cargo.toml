[package]
name = "meetesh"
version = "0.1.0"
edition = "2021"

[lib]
name = "meetesh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
log = "0.4"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
meetesh-core = { path = "../crates/meetesh-core" }
