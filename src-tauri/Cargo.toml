[package]
name = "meetesh"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nareshipme/Meetesh"

[lib]
name = "meetesh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# NVIDIA Parakeet speech engine (ONNX Runtime is downloaded at build time and linked in).
default = ["parakeet"]
parakeet = ["parakeet-engine", "meetesh-core/parakeet"]
# Same engine, with ONNX Runtime loaded at run time from ORT_DYLIB_PATH. For build machines that
# cannot download it: `cargo build --no-default-features --features parakeet-dynamic`.
parakeet-dynamic = ["parakeet-engine", "meetesh-core/parakeet-dynamic"]
parakeet-engine = []
# GPU acceleration for live assist on Windows and Linux. See the README ("GPU acceleration").
vulkan = ["meetesh-core/vulkan"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
log = "0.4"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
meetesh-core = { path = "../crates/meetesh-core", features = ["whisper", "llm"] }

# GPU acceleration for the on-device language model: Metal on macOS. Declared here so Cargo turns
# the feature on for the copy of the core (and llama.cpp) that the app uses.
[target.'cfg(target_os = "macos")'.dependencies]
meetesh-core = { path = "../crates/meetesh-core", features = ["metal"] }
# System audio on macOS (ScreenCaptureKit), see src/system_audio/macos.rs
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
