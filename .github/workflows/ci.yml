name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # also lets you run the heavy real-model job below by hand

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # whisper.cpp is compiled with -march=native by default. GitHub's runners differ in CPU model, and the
      # cache restores a build made on another one, so the real-Whisper test died with SIGILL (illegal
      # instruction) on an Ubuntu runner. A portable build also is what any released binary must be.
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: portable-ggml
      - name: Linux system libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libasound2-dev
      - run: npm ci
      - run: npm run build
      - run: cargo test --workspace
      - run: cargo build -p meetesh
      - name: Parakeet engine (ONNX Runtime linked in)
        run: cargo test -p meetesh-core --features parakeet --lib asr::parakeet
      # The GPU probe must keep compiling with the GPU backend the platform uses.
      - name: GPU probe builds (Metal)
        if: matrix.os == 'macos-latest'
        run: cargo build -p meetesh-core --example gpu_probe --features metal
      # Real transcription of the spoken fixture with the tiny model (NFR-16).
      - name: Whisper fixture test
        if: matrix.os == 'ubuntu-22.04'
        run: |
          curl -L --fail -o ggml-tiny.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          mkdir parakeet
          B=https://huggingface.co/istupakov/parakeet-tdt-0.6b-v3-onnx/resolve/8f23f0c03c8761650bdb5b40aaf3e40d2c15f1ce
          curl -L --fail -o parakeet/encoder-model.int8.onnx $B/encoder-model.int8.onnx
          curl -L --fail -o parakeet/decoder_joint-model.int8.onnx $B/decoder_joint-model.int8.onnx
          curl -L --fail -o parakeet/vocab.txt $B/vocab.txt
          cat > parakeet.sha256 <<'EOS'
          6139d2fa7e1b086097b277c7149725edbab89cc7c7ae64b23c741be4055aff09  parakeet/encoder-model.int8.onnx
          eea7483ee3d1a30375daedc8ed83e3960c91b098812127a0d99d1c8977667a70  parakeet/decoder_joint-model.int8.onnx
          d58544679ea4bc6ac563d1f545eb7d474bd6cfa467f0a6e2c1dc1c7d37e3c35d  parakeet/vocab.txt
          EOS
          sha256sum -c parakeet.sha256
          echo "921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f  ggml-tiny.en.bin" | sha256sum -c -
          MEETESH_TEST_MODEL=$PWD/ggml-tiny.en.bin cargo test -p meetesh-core --features whisper --test whisper_fixture --test whisper_live -- --nocapture
          MEETESH_TEST_MODEL=$PWD/ggml-tiny.en.bin cargo test -p meetesh-core --features whisper --test asr_quality faint_far -- --nocapture

  # The opt-in Vulkan build (Windows/Linux GPU) must keep compiling and passing its unit tests.
  vulkan-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Vulkan SDK pieces
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers
      - run: cargo test -p meetesh-core --features vulkan --lib
      - run: cargo build -p meetesh-core --features vulkan --example gpu_probe

  # Windows GPU (Vulkan): does it build with the LunarG SDK, and does a program linked against the Vulkan
  # loader start on a machine with no GPU? Informational for now (it decides whether Vulkan can become the
  # default on Windows), so it may fail without failing the workflow.
  windows-vulkan:
    # Three runs have now failed the same way inside llama.cpp's vulkan-shaders-gen sub-build with the Visual
    # Studio generator: "CMake error: Not a file: ...cmake_install.cmake" and "cannot find the batch label
    # specified - VCEnd". It happens on windows-latest (VS 18, CMake 4.5) and on windows-2022 (VS 2022), with the
    # default and with a short target folder, so it is neither the VS version nor the 260-character path limit.
    # The SDK itself is fine (glslc found, CMake "Found Vulkan", vulkan-1.dll present on the runner). With the Ninja
    # generator (below) the build succeeds in about 8 minutes and the probe starts.
    runs-on: windows-2022
    continue-on-error: true
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ninja
      # Ninja needs the Visual C++ compiler environment (cl.exe on PATH).
      - uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = (Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "Vulkan SDK at $sdk"
          & "$sdk\Bin\glslc.exe" --version
          Write-Host "vulkan-1.dll (the loader) present in System32: $(Test-Path C:\Windows\System32\vulkan-1.dll)"
          Get-Command ninja
      - run: cargo build -p meetesh-core --features vulkan --example gpu_probe
      # No model file and no GPU here, so the probe exits with 2 ("Model file not found"). What this checks is
      # that a program linked against the Vulkan loader starts at all and gets as far as asking for the model.
      - name: The Vulkan-linked probe starts
        shell: pwsh
        run: |
          cargo run -p meetesh-core --features vulkan --example gpu_probe
          if ($LASTEXITCODE -eq 2) { exit 0 }

  # NFR-22: the platform-neutral core must keep compiling for mobile targets.
  # Not yet verified in CI; allowed to fail until the first run shows what is needed.
  core-mobile:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-ios,aarch64-linux-android" }
      - run: cargo check -p meetesh-core --target aarch64-apple-ios
      - name: Android (needs the NDK clang for the bundled SQLite)
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          cargo check -p meetesh-core --target aarch64-linux-android

  # Downloads the live-assist model (3.1 GB), checks its checksum, and runs the real-model tests,
  # including Whisper and llama.cpp together in one process. Manual only: too heavy for every push.
  assist-model:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download models
        run: |
          curl -L --fail -o gemma.gguf https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_K_M.gguf
          echo "740185b21d22ceb83a11c3aa62ad5842ef32c70f6096d756bbee85a1e4ec34b8  gemma.gguf" | sha256sum -c -
          curl -L --fail -o ggml-tiny.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
      - name: Real-model tests
        run: |
          MEETESH_TEST_ASSIST_MODEL=$PWD/gemma.gguf MEETESH_TEST_MODEL=$PWD/ggml-tiny.en.bin \
            cargo test -p meetesh-core --features "whisper llm" --test llm_hint --test whisper_and_llm --test hint_vs_live --test summary_real --test queue_real --test hint_memory_real --test points_real -- --nocapture --test-threads=1
      - name: Parakeet real-model tests
        run: |
          MEETESH_TEST_PARAKEET=$PWD/parakeet cargo test --release -p meetesh-core --features parakeet --test parakeet_real -- --nocapture
          MEETESH_TEST_PARAKEET=$PWD/parakeet cargo test --release -p meetesh-core --features parakeet --test asr_quality report_words -- --nocapture
