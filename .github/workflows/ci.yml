name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # also lets you run the heavy real-model job below by hand

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libasound2-dev
      - run: npm ci
      - run: npm run build
      - run: cargo test --workspace
      - run: cargo build -p meetesh
      # Real transcription of the spoken fixture with the tiny model (NFR-16).
      - name: Whisper fixture test
        if: matrix.os == 'ubuntu-22.04'
        run: |
          curl -L --fail -o ggml-tiny.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          echo "921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f  ggml-tiny.en.bin" | sha256sum -c -
          MEETESH_TEST_MODEL=$PWD/ggml-tiny.en.bin cargo test -p meetesh-core --features whisper --test whisper_fixture --test whisper_live -- --nocapture
          MEETESH_TEST_MODEL=$PWD/ggml-tiny.en.bin cargo test -p meetesh-core --features whisper --test asr_quality faint_far -- --nocapture

  # NFR-22: the platform-neutral core must keep compiling for mobile targets.
  # Not yet verified in CI; allowed to fail until the first run shows what is needed.
  core-mobile:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-ios,aarch64-linux-android" }
      - run: cargo check -p meetesh-core --target aarch64-apple-ios
      - name: Android (needs the NDK clang for the bundled SQLite)
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          cargo check -p meetesh-core --target aarch64-linux-android

  # Downloads the live-assist model (3.1 GB), checks its checksum, and runs the real-model tests,
  # including Whisper and llama.cpp together in one process. Manual only: too heavy for every push.
  assist-model:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download models
        run: |
          curl -L --fail -o gemma.gguf https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_K_M.gguf
          echo "740185b21d22ceb83a11c3aa62ad5842ef32c70f6096d756bbee85a1e4ec34b8  gemma.gguf" | sha256sum -c -
          curl -L --fail -o ggml-tiny.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
      - name: Real-model tests
        run: |
          MEETESH_TEST_ASSIST_MODEL=$PWD/gemma.gguf MEETESH_TEST_MODEL=$PWD/ggml-tiny.en.bin \
            cargo test -p meetesh-core --features "whisper llm" --test llm_hint --test whisper_and_llm -- --nocapture
