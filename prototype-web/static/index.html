<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meetesh (web prototype)</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --rec:#dc2626; --card:#f9fafb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111214; --fg:#eee; --muted:#9aa0a6; --line:#2a2c30; --card:#1a1b1e; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); display:flex; min-height:100vh; }
  aside { width:260px; border-right:1px solid var(--line); padding:16px; overflow:auto; }
  main { flex:1; padding:24px; max-width:820px; }
  h1 { font-size:18px; margin:0 0 12px; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.rec { background:var(--rec); color:#fff; border-color:var(--rec); }
  button:disabled { opacity:.5; cursor:default; }
  .item { padding:8px 10px; border-radius:8px; cursor:pointer; }
  .item:hover, .item.active { background:var(--card); }
  .item small { color:var(--muted); display:block; }
  input.title { font:600 20px system-ui; width:100%; border:0; background:transparent; color:var(--fg); padding:4px 0; }
  .row { display:flex; gap:8px; align-items:center; margin:12px 0; flex-wrap:wrap; }
  .status { color:var(--muted); font-size:13px; }
  textarea { width:100%; min-height:200px; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; }
  .summary { white-space:pre-wrap; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:20px 0 6px; }
  @media (max-width:700px) { body { flex-direction:column; } aside { width:auto; border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <h1>Meetesh (web prototype)</h1>
  <button class="primary" id="new" style="width:100%">+ New meeting</button>
  <div id="list" style="margin-top:12px"></div>
</aside>
<main id="main"><p class="status">Select a meeting or create a new one.</p></main>
<script>
const CHUNK_MS = 15000;
let current = null, recorder = null, stream = null, queue = Promise.resolve();
const $ = s => document.querySelector(s);
const api = (p, o={}) => fetch('/api'+p, o).then(async r => { if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText); return r.json(); });
const json = (method, body) => ({ method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });

async function loadList() {
  const ms = await api('/meetings');
  $('#list').innerHTML = ms.map(m => `<div class="item ${current&&current.id===m.id?'active':''}" data-id="${m.id}">
    ${esc(m.title)}<small>${new Date(m.created_at*1000).toLocaleString()}${m.has_summary?' · summarized':''}</small></div>`).join('');
  document.querySelectorAll('.item').forEach(e => e.onclick = () => open(+e.dataset.id));
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function open(id) {
  if (recorder) await stop();
  current = await api('/meetings/'+id);
  render(); loadList();
}

function render() {
  const m = current;
  $('#main').innerHTML = `
    <input class="title" id="title" value="${esc(m.title)}">
    <div class="row">
      <button id="rec" class="primary">● Start recording</button>
      <button id="sum">Summarize</button>
      <button id="del">Delete</button>
      <span class="status" id="status"></span>
    </div>
    <h2>Summary</h2><div class="summary" id="summary">${esc(m.summary) || '<span class="status">No summary yet.</span>'}</div>
    <h2>Transcript</h2><textarea id="transcript" placeholder="Transcript appears here while recording. You can edit it.">${esc(m.transcript)}</textarea>`;
  $('#rec').onclick = () => recorder ? stop() : start();
  $('#sum').onclick = summarize;
  $('#del').onclick = async () => { if(confirm('Delete this meeting?')) { await api('/meetings/'+m.id, {method:'DELETE'}); current=null; $('#main').innerHTML=''; loadList(); } };
  $('#title').onchange = e => api('/meetings/'+m.id, json('PATCH',{title:e.target.value})).then(loadList);
  $('#transcript').onchange = e => api('/meetings/'+m.id, json('PATCH',{transcript:e.target.value}));
}

const setStatus = t => { const s=$('#status'); if(s) s.textContent = t; };

async function start() {
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch (e) { return setStatus('Microphone unavailable: '+e.message); }
  // Each chunk is a standalone recording (restart the recorder) so ffmpeg can decode it independently.
  const id = current.id;
  const cycle = () => {
    if (!stream) return;
    const r = new MediaRecorder(stream); recorder = r;
    const parts = [];
    r.ondataavailable = e => parts.push(e.data);
    r.onstop = () => {
      const blob = new Blob(parts, {type:'audio/webm'});
      if (blob.size > 1000) queue = queue.then(() => send(id, blob));
      if (stream) cycle(); else recorder = null;
    };
    r.start();
    setTimeout(() => r.state === 'recording' && r.stop(), CHUNK_MS);
  };
  cycle();
  const b = $('#rec'); b.textContent = '■ Stop'; b.className = 'rec'; setStatus('Recording…');
}

async function stop() {
  const s = stream; stream = null;
  if (recorder && recorder.state === 'recording') recorder.stop();
  s && s.getTracks().forEach(t => t.stop());
  recorder = null;
  const b = $('#rec'); if (b) { b.textContent = '● Start recording'; b.className = 'primary'; }
  setStatus('Finishing transcription…');
  await queue; setStatus('Stopped.');
}

async function send(id, blob) {
  const fd = new FormData(); fd.append('file', blob, 'chunk.webm');
  try {
    const r = await api(`/meetings/${id}/audio`, {method:'POST', body: fd});
    if (current && current.id === id) { current.transcript = r.transcript; const t=$('#transcript'); if(t){ t.value = r.transcript; t.scrollTop = t.scrollHeight; } }
  } catch (e) { setStatus('Transcription error: '+e.message); }
}

async function summarize() {
  setStatus('Summarizing…'); $('#sum').disabled = true;
  try { const r = await api(`/meetings/${current.id}/summarize`, {method:'POST'}); $('#summary').textContent = r.summary; setStatus(''); loadList(); }
  catch (e) { setStatus(e.message); }
  $('#sum').disabled = false;
}

$('#new').onclick = async () => { const m = await api('/meetings', json('POST',{})); await open(m.id); };
loadList();
</script>
</body>
</html>
