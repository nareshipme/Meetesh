[package]
name = "meetesh-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nareshipme/Meetesh"
description = "Platform-neutral core for Meetesh: storage, models and logic. No desktop-only dependencies (NFR-22)."

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
hound = "3.5"
whisper-rs = { version = "0.16.0", optional = true }
# llama.cpp (Gemma etc.) for live assist. OpenMP is left off: it is not available by default on macOS.
llama-cpp-2 = { version = "0.1.161", optional = true, default-features = false }
# Renders the chat template stored in a model file (llama.cpp cannot render newer ones).
minijinja = { version = "2", optional = true, features = ["builtins", "macros", "loop_controls"] }
minijinja-contrib = { version = "2", optional = true, features = ["pycompat"] }
ureq = "2"
sha2 = "0.11.1"
serde_json = "1.0.154"

[features]
# whisper.cpp backend. Off by default so the core stays light and easy to cross-compile.
whisper = ["dep:whisper-rs"]
# On-device language model for live assist (llama.cpp backend).
llm = ["dep:llama-cpp-2", "dep:minijinja", "dep:minijinja-contrib"]
