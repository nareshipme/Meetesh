[package]
name = "meetesh-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nareshipme/Meetesh"
description = "Platform-neutral core for Meetesh: storage, models and logic. No desktop-only dependencies (NFR-22)."

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
hound = "3.5"
whisper-rs = { version = "0.16.0", optional = true }
# NVIDIA Parakeet speech recognition on ONNX Runtime. Which ONNX Runtime is picked by the features below.
parakeet-rs = { version = "0.4.4", optional = true, default-features = false }
# llama.cpp (Gemma etc.) for live assist. OpenMP is left off: it is not available by default on macOS.
llama-cpp-2 = { version = "0.1.161", optional = true, default-features = false }
# Renders the chat template stored in a model file (llama.cpp cannot render newer ones).
minijinja = { version = "2", optional = true, features = ["builtins", "macros", "loop_controls"] }
minijinja-contrib = { version = "2", optional = true, features = ["pycompat"] }
# Forwards llama.cpp's own log messages (it only speaks `tracing`) into the app log.
tracing-core = { version = "0.1", optional = true }
log = { version = "0.4", optional = true }
ureq = "2"
sha2 = "0.11.1"
serde_json = "1.0.154"

[features]
# whisper.cpp backend. Off by default so the core stays light and easy to cross-compile.
whisper = ["dep:whisper-rs"]
# Parakeet backend; ONNX Runtime is downloaded at build time and linked in (release builds).
parakeet = ["parakeet-engine", "parakeet-rs/ort-defaults"]
# Parakeet backend with ONNX Runtime loaded at run time from the file named by ORT_DYLIB_PATH
# (for build machines that cannot download it, and for tests).
parakeet-dynamic = ["parakeet-engine", "parakeet-rs/load-dynamic"]
parakeet-engine = ["dep:parakeet-rs", "parakeet-rs/cpu", "parakeet-rs/api-28"]
# On-device language model for live assist (llama.cpp backend).
llm = ["dep:llama-cpp-2", "dep:minijinja", "dep:minijinja-contrib", "dep:tracing-core", "dep:log"]
# Run the assist model on the GPU through Metal (macOS).
metal = ["llm", "llama-cpp-2/metal"]
# Run the assist model on the GPU through Vulkan (vendor-neutral; Windows and Linux). Needs the Vulkan
# SDK (glslc, headers) to build. Opt-in: `cargo build --features vulkan`.
vulkan = ["llm", "llama-cpp-2/vulkan"]

[[example]]
name = "gpu_probe"
required-features = ["llm"]
